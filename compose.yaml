# Kandinsky in server mode: every folder in ./vaults (or $KANDINSKY_VAULTS) is a vault at http://<host>:7700/v/<folder>/.
#
#   cp .env.example .env                                     # then edit it
#   docker compose run --rm kandinsky server password            # once: the owner's password (asked twice, never echoed)
#   docker compose up -d
#
# Behind a reverse proxy with a sign-in in front (Authelia, Authentik, oauth2-proxy…): see the commented lines below and
# docs/guides/SERVER.md, "Behind a proxy".
#
# Coming from Atlas (this project's earlier name): its compose project `atlas` kept the sign-in and sessions in the
# volumes `atlas_atlas-config` and `atlas_atlas-state`, each with an `atlas/` folder, and read `ATLAS_*` from .env.
# Docker cannot rename a volume, so once, before the first `up`, copy them by hand into the new names (the old volumes
# stay until you remove them yourself), and rename the variables in .env to `KANDINSKY_*` (the server's files are then
# in kandinsky/, read there by either image: see `environment` below):
#   for v in config state; do docker run --rm -v atlas_atlas-$v:/from:ro -v kandinsky_kandinsky-$v:/to alpine \
#     sh -c 'cp -a /from/. /to/ && if [ -d /to/atlas ] && [ ! -e /to/kandinsky ]; then mv /to/atlas /to/kandinsky; fi'; done
name: kandinsky

services:
  kandinsky:
    image: ${KANDINSKY_IMAGE:-ghcr.io/antimajorana/kandinsky:latest}
    build:
      context: .
      dockerfile: packaging/docker/Dockerfile
    # the vault files keep their owner on the host: run as that user (`id -u` / `id -g`)
    user: "${KANDINSKY_UID:-1000}:${KANDINSKY_GID:-1000}"
    ports:
      - "${KANDINSKY_PORT:-7700}:7700"
    volumes:
      - ${KANDINSKY_VAULTS:-./vaults}:/vaults          # your notes: one folder per vault
      - kandinsky-config:/config                       # server.toml: the sign-in mode, the password's hash
      - kandinsky-state:/state                         # sessions, device tokens, caches
      # plugins' secrets as read-only files (/secrets/<plugin>/<name>), as Docker secrets are:
      # - ./secrets:/secrets:ro
    environment:
      TZ: ${TZ:-UTC}
      # The default image is upstream Atlas's (built from this repository it is Kandinsky's), which reads the sign-in and
      # the sessions from the files these name: the same files as Kandinsky's own image, so the folders moved below
      # (atlas/ -> kandinsky/) are found whichever image runs.
      ATLAS_SERVER_CONFIG: /config/kandinsky/server.toml
      ATLAS_SERVER_STATE: /state/kandinsky/server.json
      # KANDINSKY_SECRET_FILES: /secrets
    restart: unless-stopped
    healthcheck:
      # any HTTP answer means the server is up (the sign-in page answers whether or not one is signed in)
      test: ["CMD", "curl", "-so", "/dev/null", "http://127.0.0.1:7700/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Behind a reverse proxy that signs people in and passes `Remote-User`, set in Settings → Server (or server.toml):
    #   auth = "proxy"            # or "both" to keep the password on the LAN
    #   trusted_proxies = ["<the proxy's address or network>"]
    # and publish the port only to the proxy, e.g. `ports: ["127.0.0.1:7700:7700"]`.

volumes:
  kandinsky-config:
  kandinsky-state:
