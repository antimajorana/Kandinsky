title = "External Attachments & Embeds"
description = "Link, preview, and open external files and cloud folders (such as Dropbox, iCloud Drive, OneDrive, Google Drive, or kDrive) from inside notes"
icon = "external-link"
main = "main.js"
version = "0.1.0"
api = 28
phone = true

[[setting]]
key = "external_root"
label = "External attachments root"
kind = "text"
default = "~/CloudDrive"
hint = "Default external folder for relative external paths (for example ~/CloudDrive — Dropbox, iCloud Drive, OneDrive, Google Drive, or kDrive)"

[platforms]
windows = "works"
linux = "works"
macos = "works"
