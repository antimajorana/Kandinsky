title = "Oracle Physics Runner"
description = "Local runner for Jupyter (.ipynb), c_lint, and oracle_wiki filing."
icon = "sigma"
version = "1.1.0"
api = 28
main = "main.js"
for_agents = "Use oracle-runner tools to lint Cnn pages (c_lint)."

[permissions]
exec = ["node", "py", "python", "powershell", "cmd"]

[helper]
js = "helper.js"
idle = "15m"

[[tool]]
name = "c_lint"
method = "runCLint"
description = "Run deterministic c_lint checks (10-section schema, citation locators, script .out logs, receipt-backed multi-digit numbers) on a computation note."
input = { path = "string", anyLayout = "boolean?", strict = "boolean?" }

[platforms]
windows = "works"
linux = "works"
