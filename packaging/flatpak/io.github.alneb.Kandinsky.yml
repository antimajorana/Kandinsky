# Kandinsky as a Flatpak, from binaries already built (the Release workflow's `linux` job puts them in ./dist):
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.alneb.Kandinsky.yml
# On a desktop, packaging/flatpak/build-local.sh compiles them inside the SDK first (the runtime's glibc) and installs.
# The GNOME runtime carries WebKitGTK 4.1, which the desktop app (Tauri) draws with.
app-id: io.github.alneb.Kandinsky
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: kandinsky-app
finish-args:
  - --share=network          # plugins' services, sync, the local core on 127.0.0.1
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home        # vaults are ordinary folders, anywhere in the home folder
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  # what a vault runs (plugin helpers, vault commands, kandinsky.exec, terminals, language servers) is the user's and
  # starts on the host with `flatpak-spawn --host` (crates/kandinsky-core/src/platform/host.rs)
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: kandinsky
    buildsystem: simple
    build-commands:
      - install -Dm755 kandinsky-app /app/bin/kandinsky-app
      - install -Dm755 kandinsky /app/bin/kandinsky
      - install -Dm755 kandinsky-capture /app/bin/kandinsky-capture
      - install -Dm644 io.github.alneb.Kandinsky.Capture.desktop /app/share/applications/io.github.alneb.Kandinsky.Capture.desktop
      - install -Dm644 io.github.alneb.Kandinsky.desktop /app/share/applications/io.github.alneb.Kandinsky.desktop
      - install -Dm644 io.github.alneb.Kandinsky.metainfo.xml /app/share/metainfo/io.github.alneb.Kandinsky.metainfo.xml
      - install -Dm644 kandinsky.svg /app/share/icons/hicolor/scalable/apps/io.github.alneb.Kandinsky.svg
    sources:
      - type: file
        path: ../../dist/kandinsky-app
      - type: file
        path: ../../dist/kandinsky
      - type: file
        path: ../../dist/kandinsky-capture
      - type: file
        path: io.github.alneb.Kandinsky.Capture.desktop
      - type: file
        path: io.github.alneb.Kandinsky.desktop
      - type: file
        path: io.github.alneb.Kandinsky.metainfo.xml
      - type: file
        path: ../icon/kandinsky.svg
